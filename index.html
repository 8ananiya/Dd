<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07070b">
<title>Studio — Tools for Mind, Body & Focus</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#07070b;--panel:#0e1016;--card:#14171f;--card2:#1a1e28;
    --line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.12);
    --txt:#e9eef5;--dim:#7a8798;--dim2:#5a6470;
    --accent:#8b9dff;--accent-dim:rgba(139,157,255,.13);
    --ok:#5eead4;--warn:#fbbf24;--bad:#fb7185;
    --sidebar-w:240px;
  }
  html,body{height:100%}
  body{
    background:var(--bg);color:var(--txt);
    font-family:ui-sans-serif,-apple-system,"Segoe UI",Inter,Roboto,system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;min-height:100vh;overflow-x:hidden;
  }

  /* ---------- sidebar ---------- */
  .sidebar{
    width:var(--sidebar-w);flex:0 0 var(--sidebar-w);
    background:linear-gradient(180deg,#0b0d13,#08090d);
    border-right:1px solid var(--line);
    display:flex;flex-direction:column;
    height:100vh;position:sticky;top:0;
    overflow-y:auto;overscroll-behavior:contain;
  }
  .sidebar::-webkit-scrollbar{width:6px}
  .sidebar::-webkit-scrollbar-thumb{background:rgba(255,255,255,.06);border-radius:99px}
  .sb-brand{
    padding:20px 18px 16px;border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:10px;
  }
  .sb-brand .logo{
    width:32px;height:32px;border-radius:9px;
    background:linear-gradient(135deg,var(--accent),#c084fc);
    display:grid;place-items:center;color:#0a0a10;
    font-weight:800;font-size:15px;letter-spacing:-.02em;
  }
  .sb-brand h1{font-size:14px;font-weight:700;letter-spacing:.02em;line-height:1}
  .sb-brand p{font-size:10px;color:var(--dim);margin-top:3px;letter-spacing:.02em}

  .sb-group{padding:14px 10px 4px}
  .sb-group h2{
    font-size:9px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--dim2);font-weight:700;padding:0 8px;margin-bottom:6px;
  }
  .navitem{
    display:flex;align-items:center;gap:10px;
    padding:9px 11px;border-radius:9px;cursor:pointer;
    font-size:12.5px;font-weight:500;color:var(--dim);
    transition:all .18s;font-family:inherit;
    border:none;background:transparent;width:100%;text-align:left;
    -webkit-tap-highlight-color:transparent;
  }
  .navitem:hover{background:rgba(255,255,255,.03);color:var(--txt)}
  .navitem.active{
    background:var(--accent-dim);color:var(--accent);
    box-shadow:inset 0 0 0 1px rgba(139,157,255,.2);
  }
  .navitem .ico{
    width:22px;height:22px;flex:0 0 22px;border-radius:6px;
    display:grid;place-items:center;font-size:12px;
    background:rgba(255,255,255,.04);
    transition:all .18s;
  }
  .navitem.active .ico{background:var(--accent);color:#0a0a10}

  /* ---------- main ---------- */
  .main{
    flex:1;min-width:0;
    display:flex;flex-direction:column;
    min-height:100vh;
  }
  .topbar{
    padding:16px 24px;border-bottom:1px solid var(--line);
    display:flex;align-items:center;justify-content:space-between;
    gap:16px;position:sticky;top:0;background:rgba(7,7,11,.9);
    backdrop-filter:blur(12px);z-index:20;flex-wrap:wrap;
  }
  .topbar h2{font-size:18px;font-weight:700;letter-spacing:-.01em}
  .topbar p{font-size:12px;color:var(--dim);margin-top:2px}
  .topbar .pill{
    font-size:10px;letter-spacing:.12em;text-transform:uppercase;
    font-weight:700;padding:5px 11px;border-radius:99px;
    border:1px solid var(--line);color:var(--dim);
  }

  #view{padding:24px;max-width:960px;width:100%}

  /* ---------- reusable ---------- */
  .card{
    border:1px solid var(--line);border-radius:16px;
    background:var(--card);padding:20px;margin-bottom:16px;
  }
  .card h3{
    font-size:11px;letter-spacing:.13em;text-transform:uppercase;
    color:var(--dim);font-weight:700;margin-bottom:14px;
  }
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:720px){.grid2{grid-template-columns:1fr}}

  .btn{
    padding:10px 16px;border-radius:10px;cursor:pointer;
    font-size:13px;font-weight:600;font-family:inherit;
    background:rgba(255,255,255,.04);border:1px solid var(--line);
    color:var(--txt);transition:all .2s;
    -webkit-tap-highlight-color:transparent;outline:none;
  }
  .btn:hover{background:rgba(255,255,255,.07);border-color:var(--line2)}
  .btn:active{transform:scale(.98)}
  .btn.primary{
    background:var(--accent-dim);border-color:var(--accent);
    color:var(--accent);
  }
  .btn.primary:hover{background:rgba(139,157,255,.2)}
  .btn.danger{color:var(--bad);border-color:rgba(251,113,133,.3)}
  .btn.sm{padding:7px 12px;font-size:12px;border-radius:8px}
  .btn:disabled{opacity:.4;cursor:not-allowed}

  input[type=text],input[type=number],input[type=password],select,textarea{
    width:100%;padding:10px 13px;border-radius:10px;
    background:rgba(255,255,255,.03);border:1px solid var(--line);
    color:var(--txt);font-family:inherit;font-size:13px;
    outline:none;transition:border-color .2s;
  }
  input:focus,select:focus,textarea:focus{border-color:var(--accent)}
  textarea{resize:vertical;min-height:120px;font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:12px}

  input[type=range]{
    -webkit-appearance:none;appearance:none;width:100%;height:22px;
    background:transparent;cursor:pointer;display:block;
  }
  input[type=range]::-webkit-slider-runnable-track{
    height:4px;border-radius:99px;
    background:linear-gradient(90deg,var(--accent) 0%,var(--accent) var(--fill,50%),rgba(255,255,255,.08) var(--fill,50%),rgba(255,255,255,.08) 100%);
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:16px;height:16px;border-radius:50%;
    background:#0a0a10;border:2px solid var(--accent);
    margin-top:-6px;box-shadow:0 0 8px var(--accent-dim);
  }
  input[type=range]::-moz-range-track{height:4px;border-radius:99px;background:rgba(255,255,255,.08)}
  input[type=range]::-moz-range-thumb{
    width:14px;height:14px;border-radius:50%;background:#0a0a10;
    border:2px solid var(--accent);
  }

  .slider-row{margin-bottom:16px}
  .slider-row .lbl{
    display:flex;justify-content:space-between;align-items:baseline;
    font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--dim);font-weight:700;margin-bottom:7px;
  }
  .slider-row .lbl output{color:var(--accent);font-size:12px;font-variant-numeric:tabular-nums}

  .stat{
    display:flex;flex-direction:column;gap:4px;
    padding:12px 14px;border-radius:11px;
    background:rgba(255,255,255,.02);border:1px solid var(--line);
  }
  .stat .k{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);font-weight:700}
  .stat .v{font-size:22px;font-weight:700;color:var(--txt);font-variant-numeric:tabular-nums}
  .stat .u{font-size:11px;color:var(--dim);font-weight:500}

  .statrow{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
  @media(max-width:600px){.statrow{grid-template-columns:repeat(2,1fr)}}

  .hint{font-size:11.5px;color:var(--dim);line-height:1.6;margin-top:8px}

  /* breathing viz */
  .breath-viz{
    position:relative;height:320px;
    display:grid;place-items:center;
    border-radius:20px;overflow:hidden;
    background:radial-gradient(circle at 50% 50%, rgba(139,157,255,.06), transparent 70%),#0a0c12;
    border:1px solid var(--line);
  }
  .breath-circle{
    width:160px;height:160px;border-radius:50%;
    background:radial-gradient(circle at 50% 40%, rgba(139,157,255,.35), rgba(139,157,255,.08) 70%);
    border:2px solid var(--accent);
    display:grid;place-items:center;
    transition:transform .05s linear, box-shadow .3s;
    box-shadow:0 0 60px var(--accent-dim);
  }
  .breath-circle .txt{
    font-size:13px;font-weight:700;color:var(--accent);
    letter-spacing:.14em;text-transform:uppercase;
    text-align:center;line-height:1.3;
  }
  .breath-circle .txt small{display:block;font-size:22px;letter-spacing:0;color:var(--txt);font-weight:700;margin-top:2px}

  /* pomodoro ring */
  .pomo-ring{
    width:260px;height:260px;margin:0 auto;
    position:relative;display:grid;place-items:center;
  }
  .pomo-ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
  .pomo-ring .inner{
    text-align:center;
  }
  .pomo-ring .time{font-size:48px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
  .pomo-ring .phase{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--accent);margin-top:4px}

  /* habit list */
  .habit{
    display:flex;align-items:center;gap:12px;
    padding:12px 14px;border-radius:11px;
    background:rgba(255,255,255,.02);border:1px solid var(--line);
    margin-bottom:8px;
  }
  .habit .check{
    width:26px;height:26px;flex:0 0 26px;border-radius:7px;
    border:2px solid var(--line2);cursor:pointer;
    display:grid;place-items:center;transition:all .2s;
    background:transparent;
  }
  .habit .check.done{
    background:var(--ok);border-color:var(--ok);color:#0a0a10;
    font-weight:900;
  }
  .habit .name{flex:1;font-size:13.5px;font-weight:500}
  .habit .name.done{text-decoration:line-through;color:var(--dim)}
  .habit .streak{
    font-size:10.5px;color:var(--dim);font-variant-numeric:tabular-nums;
    padding:3px 8px;border-radius:99px;background:rgba(255,255,255,.03);
  }

  /* typing */
  .typing-text{
    font-size:20px;line-height:1.9;letter-spacing:.01em;
    font-family:ui-monospace,"SF Mono",Menlo,monospace;
    padding:24px;border-radius:14px;
    background:rgba(255,255,255,.02);border:1px solid var(--line);
    margin-bottom:16px;user-select:none;
  }
  .typing-text span{transition:color .1s}
  .typing-text .ok{color:var(--ok)}
  .typing-text .bad{color:var(--bad);background:rgba(251,113,133,.15);border-radius:3px}
  .typing-text .cur{
    background:var(--accent);color:#0a0a10;border-radius:3px;
    animation:caret 1s infinite;
  }
  @keyframes caret{50%{opacity:.4}}

  /* color tools */
  .swatch{
    aspect-ratio:1;border-radius:12px;cursor:pointer;
    border:1px solid var(--line);
    display:flex;align-items:flex-end;justify-content:center;
    padding:8px;transition:transform .15s;
    position:relative;
  }
  .swatch:hover{transform:scale(1.03)}
  .swatch span{
    font-size:10.5px;font-family:ui-monospace,monospace;
    font-weight:700;letter-spacing:.02em;
    background:rgba(0,0,0,.55);padding:3px 6px;border-radius:5px;
    color:#fff;backdrop-filter:blur(6px);
  }
  .palette{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
  @media(max-width:600px){.palette{grid-template-columns:repeat(3,1fr)}}

  /* soundscape mixer */
  .mixer-channel{
    display:grid;grid-template-columns:120px 1fr 60px;gap:12px;
    align-items:center;padding:10px 0;
    border-bottom:1px solid var(--line);
  }
  .mixer-channel:last-child{border-bottom:none}
  .mixer-channel .nm{font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:8px}
  .mixer-channel .nm .em{font-size:16px}
  .mixer-channel .val{font-size:11.5px;color:var(--accent);text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
  .mixer-channel .mute{grid-column:1/-1;margin-top:6px}
  @media(max-width:520px){
    .mixer-channel{grid-template-columns:1fr;gap:6px}
  }

  /* toast */
  #toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--card2);border:1px solid var(--line2);color:var(--txt);
    padding:12px 20px;border-radius:12px;font-size:13px;font-weight:500;
    box-shadow:0 10px 40px rgba(0,0,0,.5);
    opacity:0;pointer-events:none;transition:all .3s;z-index:999;
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* mobile */
  .hamburger{
    display:none;width:36px;height:36px;border-radius:9px;
    background:rgba(255,255,255,.04);border:1px solid var(--line);
    color:var(--txt);cursor:pointer;place-items:center;
    -webkit-tap-highlight-color:transparent;outline:none;
  }
  .hamburger svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}

  @media(max-width:820px){
    .hamburger{display:grid}
    .sidebar{
      position:fixed;left:0;top:0;z-index:100;
      transform:translateX(-100%);transition:transform .3s;
      box-shadow:0 0 40px rgba(0,0,0,.6);
    }
    .sidebar.open{transform:translateX(0)}
    .backdrop{
      position:fixed;inset:0;background:rgba(0,0,0,.5);
      z-index:99;opacity:0;pointer-events:none;transition:opacity .3s;
    }
    .backdrop.show{opacity:1;pointer-events:auto}
  }
</style>
</head>
<body>

<aside class="sidebar" id="sidebar">
  <div class="sb-brand">
    <div class="logo">S</div>
    <div>
      <h1>Studio</h1>
      <p>Mind · Body · Focus</p>
    </div>
  </div>
  <nav id="nav"></nav>
</aside>

<div class="backdrop" id="backdrop"></div>

<main class="main">
  <div class="topbar">
    <button class="hamburger" id="hamburger" aria-label="Menu">
      <svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>
    <div style="flex:1;min-width:0">
      <h2 id="tbTitle">Studio</h2>
      <p id="tbSub">Pick a tool from the sidebar</p>
    </div>
    <div class="pill" id="tbPill">ready</div>
  </div>
  <div id="view"></div>
</main>

<div id="toast"></div>

<script>
(() => {
"use strict";

/* ============================================================
   SHARED ENGINE
   ============================================================ */
const Engine = {
  ctx: null,
  cleanup: null,
  audio() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AC();
    }
    if (this.ctx.state === 'suspended') this.ctx.resume();
    return this.ctx;
  },
  unmount() {
    if (this.cleanup) { try { this.cleanup(); } catch(e){} this.cleanup = null; }
  }
};

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._tid);
  t._tid = setTimeout(() => t.classList.remove('show'), 2200);
}

function el(html) {
  const d = document.createElement('div');
  d.innerHTML = html.trim();
  return d.firstElementChild;
}

function bindSlider(root, id, onChange) {
  const s = root.querySelector('#' + id);
  const out = root.querySelector('#' + id + 'Out');
  const paint = () => {
    const pct = ((+s.value - +s.min) / (+s.max - +s.min)) * 100;
    s.style.setProperty('--fill', pct + '%');
  };
  s.addEventListener('input', () => {
    if (out) out.textContent = s.value + (s.dataset.unit || '');
    paint(); onChange(+s.value);
  });
  paint();
  if (out) out.textContent = s.value + (s.dataset.unit || '');
  return s;
}

function fmtTime(sec) {
  const m = Math.floor(sec/60), s = Math.floor(sec%60);
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}

/* ============================================================
   TOOL REGISTRY
   ============================================================ */
const TOOLS = {};

/* ------------------------------------------------------------
   SOUND STUDIO
   ------------------------------------------------------------ */
TOOLS.studio = {
  name: 'Sound Studio', icon: '♪', cat: 'Audio',
  sub: 'Binaural beats for 8 mental states',
  html: () => `
    <div class="card">
      <h3>Mental state</h3>
      <div id="st_grid" style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px"></div>
      <p class="hint">Headphones required for binaural effect.</p>
    </div>
    <div class="card">
      <h3>Player</h3>
      <div class="row" style="gap:14px;margin-bottom:14px">
        <button class="btn primary" id="st_play" style="flex:0 0 auto">▶ Play</button>
        <div style="flex:1;min-width:180px">
          <div class="lbl" style="display:flex;justify-content:space-between;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);font-weight:700;margin-bottom:7px"><span>Volume</span><output id="st_volOut">60%</output></div>
          <input type="range" id="st_vol" min="0" max="100" value="60">
        </div>
      </div>
      <div id="st_status" class="hint">Nothing playing.</div>
    </div>
  `,
  init: (v) => {
    const MODES = [
      { id:'relax', n:'Relax', c:'#5eead4', beat:10, carrier:200, chord:[130.81,164.81,196.00,261.63], filt:900, noise:'pink', gain:0.11 },
      { id:'focus', n:'Focus', c:'#60a5fa', beat:16, carrier:220, chord:[110.00,164.81,220.00,329.63], filt:1400, noise:'pink', gain:0.09 },
      { id:'sleep', n:'Sleep', c:'#818cf8', beat:2.5, carrier:110, chord:[65.41,98.00,130.81], filt:420, noise:'brown', gain:0.14 },
      { id:'energize', n:'Energize', c:'#fbbf24', beat:22, carrier:260, chord:[146.83,220.00,293.66,369.99], filt:2200, noise:'pink', gain:0.10 },
      { id:'fear', n:'Release Fear', c:'#fb7185', beat:6, carrier:396, chord:[98.00,146.83,196.00,293.66], filt:1100, noise:'pink', gain:0.11 },
      { id:'happy', n:'Happy', c:'#facc15', beat:10, carrier:528, chord:[130.81,164.81,196.00,329.63], filt:1600, noise:'pink', gain:0.10 },
      { id:'confident', n:'Confident', c:'#fb923c', beat:14, carrier:639, chord:[87.31,130.81,174.61,261.63], filt:1300, noise:'pink', gain:0.11 },
      { id:'creative', n:'Creative', c:'#c084fc', beat:7, carrier:852, chord:[130.81,146.83,196.00,293.66], filt:1800, noise:'pink', gain:0.10 }
    ];

    let playing = null;
    let cleanupAudio = () => {};
    const grid = v.querySelector('#st_grid');

    MODES.forEach(m => {
      const b = el(`<button class="btn" style="padding:14px 8px;text-align:left;line-height:1.3;border-left:3px solid ${m.c}"><div style="font-weight:700;font-size:13px">${m.n}</div><div style="font-size:9.5px;color:var(--dim);letter-spacing:.08em;text-transform:uppercase;margin-top:3px">${m.beat} Hz</div></button>`);
      b.addEventListener('click', () => select(m));
      grid.appendChild(b);
    });

    async function select(m) {
      cleanupAudio();
      const ctx = Engine.audio();
      const status = v.querySelector('#st_status');
      status.textContent = `Playing ${m.n} — ${m.beat} Hz binaural, ${m.carrier} Hz carrier.`;

      const master = ctx.createGain();
      master.gain.value = 0;
      master.connect(ctx.destination);
      master.gain.setTargetAtTime(0.6, ctx.currentTime, 0.5);

      const nodes = [];

      // pad
      const pad = ctx.createGain();
      pad.gain.value = m.gain;
      const filt = ctx.createBiquadFilter();
      filt.type='lowpass'; filt.frequency.value = m.filt; filt.Q.value = 0.6;
      filt.connect(pad); pad.connect(master);
      m.chord.forEach((f,i) => {
        const o = ctx.createOscillator(); o.type = i===1?'triangle':'sine';
        o.frequency.value = f; o.detune.value = (i-1)*4;
        const g = ctx.createGain(); g.gain.value = 0.3/(i+1);
        o.connect(g); g.connect(filt); o.start();
        nodes.push(o);
      });
      // binaural
      const bin = ctx.createGain(); bin.gain.value = 0.09; bin.connect(master);
      [-1, 1].forEach((pan, i) => {
        const p = ctx.createStereoPanner(); p.pan.value = pan; p.connect(bin);
        const o = ctx.createOscillator(); o.type='sine';
        o.frequency.value = m.carrier + (i===1?m.beat:0);
        o.connect(p); o.start(); nodes.push(o);
      });
      // noise
      const nlen = ctx.sampleRate * 3;
      const nb = ctx.createBuffer(1, nlen, ctx.sampleRate);
      const nd = nb.getChannelData(0);
      let last = 0;
      for (let i=0;i<nlen;i++){
        const w = Math.random()*2-1;
        if (m.noise === 'brown'){ last = (last + 0.02*w)/1.02; nd[i] = last*3; }
        else nd[i] = w*0.4;
      }
      const ns = ctx.createBufferSource(); ns.buffer = nb; ns.loop = true;
      const nf = ctx.createBiquadFilter(); nf.type='lowpass'; nf.frequency.value = m.noise==='brown'?800:2400;
      const ng = ctx.createGain(); ng.gain.value = 0.08;
      ns.connect(nf); nf.connect(ng); ng.connect(master); ns.start();
      nodes.push(ns);

      playing = m;
      v.querySelector('#st_play').textContent = '■ Stop';

      cleanupAudio = () => {
        master.gain.setTargetAtTime(0, ctx.currentTime, 0.3);
        setTimeout(() => {

      coh: { name:'Coherent', steps:[['Inhale',5.5],['Exhale',5.5]] },
      calm: { name:'Calm', steps:[['Inhale',4],['Exhale',6]] }
    };
    let pattern = patterns.box;
    let running = false;
    let stepIdx = 0, stepStart = 0, cycles = 0;
    let raf = null;
    let soundOn = true;

    const circle = v.querySelector('#br_circle');
    const txt = circle.querySelector('.txt');
    const stats = v.querySelector('#br_stats');

    let ctx = null, tone = null, toneGain = null;

    v.querySelectorAll('[data-p]').forEach(b => {
      b.addEventListener('click', () => {
        v.querySelectorAll('[data-p]').forEach(x => x.classList.remove('primary'));
        b.classList.add('primary');
        pattern = patterns[b.dataset.p];
        if (running) { stepIdx = 0; stepStart = performance.now(); }
      });
    });
    v.querySelector('[data-p="box"]').classList.add('primary');

    async function startTone(freq) {
      if (!soundOn) return;
      const c = Engine.audio();
      if (!tone) {
        tone = c.createOscillator(); tone.type='sine';
        toneGain = c.createGain(); toneGain.gain.value = 0;
        tone.connect(toneGain); toneGain.connect(c.destination);
        tone.start();
      }
      tone.frequency.setTargetAtTime(freq, c.currentTime, 0.05);
      toneGain.gain.setTargetAtTime(0.05, c.currentTime, 0.1);
    }
    function stopTone() {
      if (toneGain && Engine.ctx) toneGain.gain.setTargetAtTime(0, Engine.ctx.currentTime, 0.2);
    }

    function loop() {
      if (!running) return;
      const now = performance.now();
      const step = pattern.steps[stepIdx];
      const elapsed = (now - stepStart) / 1000;
      const pct = Math.min(1, elapsed / step[1]);
      const remaining = Math.max(0, step[1] - elapsed);

      // scale 0.55 to 1.0
      const scale = 0.55 + pct * 0.5;
      circle.style.transform = `scale(${scale})`;
      circle.style.opacity = 0.7 + pct * 0.3;

      txt.innerHTML = `${step[0]}<small>${remaining.toFixed(1)}</small>`;

      // tone freq
      if (step[0]==='Inhale') startTone(440 + pct*100);
      else if (step[0]==='Exhale') startTone(440 - pct*100);
      else stopTone();

      if (pct >= 1) {
        stepIdx++;
        if (stepIdx >= pattern.steps.length) { stepIdx = 0; cycles++; stats.textContent = `Cycles: ${cycles}`; }
        stepStart = now;
      }
      raf = requestAnimationFrame(loop);
    }

    v.querySelector('#br_start').addEventListener('click', () => {
      running = !running;
      v.querySelector('#br_start').textContent = running ? 'Stop' : 'Start';
      if (running) { stepIdx = 0; stepStart = performance.now(); cycles = 0; loop(); }
      else { if (raf) cancelAnimationFrame(raf); raf=null; stopTone();
        circle.style.transform=''; txt.innerHTML='Ready<small>—</small>'; }
    });

    v.querySelector('#br_sound').addEventListener('click', (e) => {
      soundOn = !soundOn;
      e.target.textContent = soundOn ? '🔊 Sound: on' : '🔇 Sound: off';
      if (!soundOn) stopTone();
    });

    Engine.cleanup = () => {
      running = false;
      if (raf) cancelAnimationFrame(raf);
      try { if (tone) tone.stop(); } catch(e){}
    };
  }
};

TOOLS.meditation = {
  name: 'Meditation Timer', icon: '◐', cat: 'Audio',
  sub: 'Timed sits with interval bells',
  html: () => `
    <div class="card">
      <h3>Session</h3>

      </div>
      <div class="slider-row">
        <div class="lbl"><span>Interval bell</span><output id="md_intOut">5 min</output></div>
        <input type="range" id="md_int" min="1" max="10" value="5" data-unit=" min">
      </div>
      <div class="row" style="margin-bottom:14px">
        <button class="btn" id="md_bell">🔔 Bell: on</button>
        <button class="btn" id="md_pad">♪ Ambient: on</button>
      </div>

    </div>
    <div class="card" style="text-align:center">
      <div id="md_time" style="font-size:64px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1">15:00</div>
      <div class="hint" id="md_status">Ready when you are.</div>
    </div>
  `,
  init: (v) => {
    let duration = 15*60, interval = 5*60, running = false;
    let remaining = duration, raf = null, lastTick = 0;
    let bellOn = true, padOn = true;
    let padNodes = [], ctx = null, pad = null, masterPad = null;

    const timeEl = v.querySelector('#md_time');
    const statusEl = v.querySelector('#md_status');

    function updateTime() { timeEl.textContent = fmtTime(remaining); }

    v.querySelectorAll('[data-d]').forEach(b => {
      b.addEventListener('click', () => {
        v.querySelectorAll('[data-d]').forEach(x => x.classList.remove('primary'));
        b.classList.add('primary');
        duration = +b.dataset.d * 60;
        remaining = duration;
        updateTime();
      });
    });
    bindSlider(v, 'md_int', (x) => interval = x*60);

    v.querySelector('#md_bell').addEventListener('click', (e) => {
      bellOn = !bellOn; e.target.textContent = bellOn ? '🔔 Bell: on' : '🔕 Bell: off';
    });
    v.querySelector('#md_pad').addEventListener('click', (e) => {
      padOn = !padOn; e.target.textContent = padOn ? '♪ Ambient: on' : '♪ Ambient: off';
    });

    async function playBell(freq = 660, dur = 1.8) {
      if (!bellOn) return;
      const c = Engine.audio();
      const o1 = c.createOscillator(); o1.type='sine'; o1.frequency.value=freq;
      const o2 = c.createOscillator(); o2.type='sine'; o2.frequency.value=freq*2.01;
      const g = c.createGain(); g.gain.value=0;
      o1.connect(g); o2.connect(g); g.connect(c.destination);
      o1.start(); o2.start();
      g.gain.setValueAtTime(0, c.currentTime);
      g.gain.linearRampToValueAtTime(0.25, c.currentTime+0.01);
      g.gain.exponentialRampToValueAtTime(0.001, c.currentTime+dur);
      setTimeout(()=>{ try{o1.stop();o2.stop();}catch(e){} }, (dur+0.2)*1000);
    }

    async function startPad() {
      if (!padOn) return;
      const c = Engine.audio();
      masterPad = c.createGain(); masterPad.gain.value = 0;
      masterPad.connect(c.destination);
      masterPad.gain.setTargetAtTime(0.08, c.currentTime, 1);
      const filt = c.createBiquadFilter(); filt.type='lowpass'; filt.frequency.value=600;
      filt.connect(masterPad);
      [130.81, 196.00, 261.63].forEach((f,i) => {
        const o = c.createOscillator(); o.type='sine'; o.frequency.value=f;
        o.detune.value = (i-1)*3;
        const g = c.createGain(); g.gain.value=0.3;
        o.connect(g); g.connect(filt); o.start();
        padNodes.push(o,g);
      });
      padNodes.push(filt);
      pad = { master: masterPad };
    }
    function stopPad() {
      if (!Engine.ctx || !masterPad) return;
      masterPad.gain.setTargetAtTime(0, Engine.ctx.currentTime, 1);
      const nodes = padNodes.slice(); padNodes = [];
      setTimeout(() => nodes.forEach(n => { try{n.stop?.();}catch(e){} try{n.disconnect?.();}catch(e){} }), 2000);
      pad = null; masterPad = null;
    }

    function tick(now) {
      if (!running) return;
      const dt = (now - lastTick) / 1000;
      lastTick = now;
      remaining -= dt;
      if (remaining <= 0) {
        remaining = 0; updateTime();
        finish();
        return;
      }
      // interval bell
      const before = Math.ceil((remaining + dt) / interval);
      const after = Math.ceil(remaining / interval);
      if (before !== after && remaining > 1) playBell(880, 1.2);
      updateTime();
      raf = requestAnimationFrame(tick);
    }

    function finish() {
      running = false;
      playBell(440, 3);
      stopPad();
      statusEl.textContent = 'Session complete.';
      v.querySelector('#md_start').textContent = 'Start session';
      if (raf) cancelAnimationFrame(raf); raf = null;
    }

    v.querySelector('#md_start').addEventListener('click', () => {
      if (running) {
        running = false;
        if (raf) cancelAnimationFrame(raf); raf = null;
        stopPad();
        statusEl.textContent = 'Paused.';
        v.querySelector('#md_start').textContent = 'Resume';
      } else {
        if (remaining <= 0) remaining = duration;
        running = true;
        lastTick = performance.now();
        startPad();
        playBell(660, 1.5);
        statusEl.textContent = `Meditating...`;
        v.querySelector('#md_start').textContent = 'Pause';
        raf = requestAnimationFrame(tick);
      }
    });

    updateTime();
    Engine.cleanup = () => { running = false; if(raf) cancelAnimationFrame(raf); stopPad(); };
  }
};

TOOLS.soundscape = {
  name: 'Soundscape Mixer', icon: '≋', cat: 'Audio',
  sub: 'Layer rain, wind, waves, fire, noise',
  html: () => `

        <button class="btn sm" id="sc_saveFocus">Preset: Focus</button>
      </div>
    </div>
  `,
  init: (v) => {
    const CHANNELS = [
      { id:'rain', name:'Rain', em:'🌧', gen:'rain' },
      { id:'wind', name:'Wind', em:'🌬', gen:'wind' },
      { id:'waves', name:'Waves', em:'🌊', gen:'waves' },
      { id:'fire', name:'Fire', em:'🔥', gen:'fire' },
      { id:'pink', name:'Pink noise', em:'▮', gen:'pink' },
      { id:'brown', name:'Brown noise', em:'▬', gen:'brown' }
    ];

    const state = {};
    CHANNELS.forEach(c => state[c.id] = { gain: 0, node: null });

    const wrap = v.querySelector('#sc_channels');
    CHANNELS.forEach(c => {
      const row = el(`
        <div class="mixer-channel" data-ch="${c.id}">
          <div class="nm"><span class="em">${c.em}</span>${c.name}</div>
          <input type="range" min="0" max="100" value="0">
          <div class="val">0%</div>
        </div>
      `);
      wrap.appendChild(row);
      const slider = row.querySelector('input');
      const val = row.querySelector('.val');
      slider.addEventListener('input', () => {
        const g = +slider.value / 100;
        state[c.id].gain = g;
        val.textContent = slider.value + '%';
        const pct = slider.value;
        slider.style.setProperty('--fill', pct + '%');
        if (state[c.id].node) {
          state[c.id].node.gain.setTargetAtTime(g * 0.35, Engine.ctx.currentTime, 0.1);
        }
        if (g > 0 && !state[c.id].node && Engine.ctx) startChannel(c.id);
        if (g === 0 && state[c.id].node) stopChannel(c.id);
      });
      // paint initial
      slider.style.setProperty('--fill', '0%');
    });

    function makeNoise(c, type) {
      const len = c.sampleRate * 4;
      const b = c.createBuffer(1, len, c.sampleRate);
      const d = b.getChannelData(0);
      if (type === 'brown') {
        let last = 0;
        for (let i=0;i<len;i++){ const w = Math.random()*2-1; last = (last+0.02*w)/1.02; d[i] = last*3.5; }
      } else {
        for (let i=0;i<len;i++) d[i] = Math.random()*2-1;
      }
      return b;
    }

    function startChannel(id) {
      const c = Engine.audio();
      const ch = CHANNELS.find(x => x.id === id);
      let src;
      if (ch.gen === 'rain' || ch.gen === 'wind' || ch.gen === 'fire' || ch.gen === 'pink') {
        src = c.createBufferSource(); src.buffer = makeNoise(c, 'white'); src.loop = true;
      } else {
        src = c.createBufferSource(); src.buffer = makeNoise(c, 'brown'); src.loop = true;
      }
      const filt = c.createBiquadFilter();
      const g = c.createGain();
      g.gain.value = state[id].gain * 0.35;

      if (ch.gen === 'rain') { filt.type='bandpass'; filt.frequency.value=3000; filt.Q.value=0.4; }
      else if (ch.gen === 'wind') { filt.type='lowpass'; filt.frequency.value=600; }
      else if (ch.gen === 'waves') { filt.type='lowpass'; filt.frequency.value=500; }
      else if (ch.gen === 'fire') { filt.type='bandpass'; filt.frequency.value=1200; filt.Q.value=0.7; }
      else if (ch.gen === 'pink') { filt.type='allpass'; }
      else if (ch.gen === 'brown') { filt.type='lowpass'; filt.frequency.value=900; }

      src.connect(filt); filt.connect(g); g.connect(c.destination);
      src.start();
      state[id].node = g;
      state[id]._nodes = [src, filt, g];

      // amplitude LFO for waves / fire
      if (ch.gen === 'waves' || ch.gen === 'fire') {
        const lfo = c.createOscillator(); lfo.frequency.value = ch.gen==='waves'?0.08:0.3;
        const lg = c.createGain(); lg.gain.value = ch.gen==='waves'?0.5:0.4;
        const offset = c.createConstantSource(); offset.offset.value = ch.gen==='waves'?0.6:0.7;
        lfo.connect(lg); lg.connect(g.gain);
        offset.connect(g.gain);
        lfo.start(); offset.start();
        state[id]._nodes.push(lfo, lg, offset);
      }
    }

    function stopChannel(id) {
      const s = state[id];
      if (!s.node || !Engine.ctx) return;
      s.node.gain.setTargetAtTime(0, Engine.ctx.currentTime, 0.2);
      const nodes = s._nodes || [];
      setTimeout(() => nodes.forEach(n => { try{n.stop?.();}catch(e){} try{n.disconnect?.();}catch(e){} }), 800);
      s.node = null; s._nodes = null;
    }

    v.querySelector('#sc_play').addEventListener('click', () => {
      // start any channel with gain > 0
      CHANNELS.forEach(c => { if (state[c.id].gain > 0 && !state[c.id].node) startChannel(c.id); });
      toast('Playback started');
    });

    v.querySelector('#sc_panic').addEventListener('click', () => {
      CHANNELS.forEach(c => { stopChannel(c.id); state[c.id].gain = 0; });
      v.querySelectorAll('.mixer-channel').forEach(r => {
        r.querySelector('input').value = 0;
        r.querySelector('input').style.setProperty('--fill','0%');
        r.querySelector('.val').textContent = '0%';
      });
    });

    function applyPreset(p) {
      v.querySelector('#sc_panic').click();
      Object.entries(p).forEach(([id, val]) => {
        const row = v.querySelector(`.mixer-channel[data-ch="${id}"]`);
        if (!row) return;
        const s = row.querySelector('input');
        s.value = val; s.dispatchEvent(new Event('input'));
      });
      v.querySelector('#sc_play').click();
    }

    v.querySelector('#sc_saveRain').addEventListener('click', () => applyPreset({ rain:60, wind:30, waves:20, fire:0, pink:10, brown:0 }));
    v.querySelector('#sc_saveFocus').addEventListener('click', () => applyPreset({ rain:0, wind:0, waves:0, fire:0, pink:40, brown:30 }));

    Engine.cleanup = () => { CHANNELS.forEach(c => stopChannel(c.id)); };
  }
};

    <div class="statrow">
      <div class="stat"><div class="k">Completed</div><div class="v" id="pd_done">0</div></div>
      <div class="stat"><div class="k">Cycle</div><div class="v" id="pd_cyc">1</div></div>
      <div class="stat"><div class="k">Focus today</div><div class="v" id="pd_today">0</div><div class="u">min</div></div>
      <div class="stat"><div class="k">Phase</div><div class="v" id="pd_cph">—</div></div>
    </div>
    <div class="card">
      <div class="row">
        <div style="flex:1"><div class="lbl" style="font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);font-weight:700;margin-bottom:7px"><span>Focus (min)</span><output id="pd_fOut">25</output></div>
        <input type="range" id="pd_f" min="10" max="60" value="25"></div>
        <div style="flex:1"><div class="lbl" style="font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);font-weight:700;margin-bottom:7px"><span>Break (min)</span><output id="pd_bOut">5</output></div>
        <input type="range" id="pd_b" min="3" max="20" value="5"></div>
      </div>
    </div>
  `,
  init: (v) => {
    let focusMin = 25, breakMin = 5;
    let phase = 'focus', remaining = focusMin*60, running = false, raf = null, last = 0;
    let completed = 0, cycle = 1, todayMin = 0;

    const timeEl = v.querySelector('#pd_time');
    const phaseEl = v.querySelector('#pd_phase');
    const prog = v.querySelector('#pd_prog');
    const doneEl = v.querySelector('#pd_done');
    const cycEl = v.querySelector('#pd_cyc');
    const todayEl = v.querySelector('#pd_today');
    const cphEl = v.querySelector('#pd_cph');

    bindSlider(v, 'pd_f', (x) => { focusMin = x; if(!running && phase==='focus'){remaining=x*60;update();} });
    bindSlider(v, 'pd_b', (x) => { breakMin = x; if(!running && phase==='break'){remaining=x*60;update();} });

    function update() {
      timeEl.textContent = fmtTime(remaining);
      const total = phase==='focus' ? focusMin*60 : breakMin*60;
      const pct = 1 - remaining/total;
      const circ = 2 * Math.PI * 118;
      prog.style.strokeDashoffset = (circ * pct).toFixed(1);
      prog.style.stroke = phase==='focus' ? '#8b9dff' : '#5eead4';
      phaseEl.textContent = phase==='focus' ? 'Focus' : 'Break';
      phaseEl.style.color = phase==='focus' ? '#8b9dff' : '#5eead4';
      cphEl.textContent = phase==='focus' ? 'Work' : 'Rest';
      doneEl.textContent = completed;
      cycEl.textContent = cycle;
      todayEl.textContent = Math.round(todayMin);
    }

    async function bell(f=880, dur=1.2) {
      const c = Engine.audio();
      const o = c.createOscillator(); o.type='sine'; o.frequency.value=f;
      const g = c.createGain(); g.gain.value=0;
      o.connect(g); g.connect(c.destination); o.start();
      g.gain.linearRampToValueAtTime(0.25, c.currentTime+0.01);
      g.gain.exponentialRampToValueAtTime(0.001, c.currentTime+dur);
      setTimeout(()=>{try{o.stop();}catch(e){}}, (dur+0.2)*1000);
    }

    function nextPhase() {
      if (phase === 'focus') {
        completed++; todayMin += focusMin;
        phase = 'break';
        remaining = breakMin*60;
        bell(660, 1.4);
      } else {
        phase = 'focus';
        cycle++;
        remaining = focusMin*60;
        bell(880, 1.2);
      }
      update();
    }

    function tick(now) {
      if (!running) return;
      const dt = (now - last) / 1000;
      last = now;
      remaining -= dt;
      if (remaining <= 0) { remaining = 0; nextPhase(); }
      update();
      raf = requestAnimationFrame(tick);
    }

    v.querySelector('#pd_start').addEventListener('click', () => {
      running = !running;
      v.querySelector('#pd_start').textContent = running ? 'Pause' : 'Start';
      if (running) { last = performance.now(); raf = requestAnimationFrame(tick); }
      else if (raf) { cancelAnimationFrame(raf); raf=null; }
    });
    v.querySelector('#pd_skip').addEventListener('click', nextPhase);
    v.querySelector('#pd_reset').addEventListener('click', () => {
      running = false; if (raf) cancelAnimationFrame(raf); raf=null;
      phase='focus'; remaining=focusMin*60; completed=0; cycle=1; todayMin=0;
      v.querySelector('#pd_start').textContent='Start';
      update();
    });

    update();
    Engine.cleanup = () => { if(raf) cancelAnimationFrame(raf); };
  }
};

        <div class="stat"><div class="k">Best streak</div><div class="v" id="hb_best">0</div></div>
        <div class="stat"><div class="k">Completion</div><div class="v" id="hb_pct">0<span class="u">%</span></div></div>
      </div>
    </div>
  `,
  init: (v) => {
    const KEY = 'studio_habits_v1';
    const DKEY = 'studio_habits_done_v1';
    let habits = JSON.parse(localStorage.getItem(KEY) || '[]');
    let doneMap = JSON.parse(localStorage.getItem(DKEY) || '{}');
    const today = new Date().toISOString().slice(0,10);

    const dateEl = v.querySelector('#hb_date');
    const listEl = v.querySelector('#hb_list');
    const emptyEl = v.querySelector('#hb_empty');
    dateEl.textContent = new Date().toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});

    function save() {
      localStorage.setItem(KEY, JSON.stringify(habits));
      localStorage.setItem(DKEY, JSON.stringify(doneMap));
    }

    function isDone(id) {
      return (doneMap[today] || {})[id] === true;
    }
    function toggleDone(id) {
      if (!doneMap[today]) doneMap[today] = {};
      doneMap[today][id] = !doneMap[today][id];
      save();
      render();
    }
    function streak(id) {
      let s = 0;
      const d = new Date();
      for (let i=0;i<365;i++) {
        const dayKey = new Date(d.getTime() - i*86400000).toISOString().slice(0,10);
        if ((doneMap[dayKey]||{})[id]) s++;
        else if (i > 0) break;
      }
      return s;
    }

    function render() {
      listEl.innerHTML = '';
      emptyEl.style.display = habits.length === 0 ? 'block' : 'none';
      habits.forEach(h => {
        const done = isDone(h.id);
        const row = el(`
          <div class="habit">
            <button class="check ${done?'done':''}">${done?'✓':''}</button>
            <div class="name ${done?'done':''}">${h.name}</div>
            <div class="streak">🔥 ${streak(h.id)}</div>
            <button class="btn sm danger" style="padding:5px 8px">×</button>
          </div>
        `);
        row.querySelector('.check').addEventListener('click', () => toggleDone(h.id));
        row.querySelector('.danger').addEventListener('click', () => {
          habits = habits.filter(x => x.id !== h.id);
          save(); render();
        });
        listEl.appendChild(row);
      });
      // stats
      v.querySelector('#hb_total').textContent = habits.length;
      const doneCount = habits.filter(h => isDone(h.id)).length;
      v.querySelector('#hb_done').textContent = doneCount;
      v.querySelector('#hb_best').textContent = habits.length ? Math.max(...habits.map(h => streak(h.id))) : 0;
      const pct = habits.length ? Math.round(doneCount / habits.length * 100) : 0;
      v.querySelector('#hb_pct').innerHTML = pct + '<span class="u">%</span>';
    }

    v.querySelector('#hb_add').addEventListener('click', () => {
      const inp = v.querySelector('#hb_input');
      const name = inp.value.trim();
      if (!name) return;
      habits.push({ id: Date.now().toString(36), name });
      inp.value = '';
      save(); render();
    });
    v.querySelector('#hb_input').addEventListener('keydown', e => {
      if (e.key === 'Enter') v.querySelector('#hb_add').click();
    });

    render();
  }
};

      for (let cycles = 6; cycles >= 3; cycles--) {

        out.push({ cycles, time: t });
      }
      return out;
    }
    function calcBed(bed) {
      const [h,m] = bed.split(':').map(Number);
      const base = new Date(); base.setHours(h, m, 0, 0);
      const out = [];
      for (let cycles = 3; cycles <= 6; cycles++) {
        const t = new Date(base.getTime() + (cycles*90 + 15) * 60000);
        out.push({ cycles, time: t });
      }
      return out;
    }
    function render(el, rows) {
      el.innerHTML = '<h3>Recommended times</h3>' + rows.map(r =>

    </div>
    <input type="text" id="ty_input" autocomplete="off" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
           style="position:absolute;opacity:0;pointer-events:none;left:-9999px">
    <p class="hint">Click the text and start typing. Your browser will route keys into a hidden input.</p>
  `,
  init: (v) => {
    const PASSAGES = [
      "The quick brown fox jumps over the lazy dog near the river bank on a bright summer morning.",
      "Programming is the art of telling another human what one wants the computer to do with clarity.",
      "A journey of a thousand miles begins with a single step, but the path is rarely straight.",
      "Silence is the sleep that nourishes wisdom, and music is the sound that awakens the soul.",
      "The cosmos is within us, we are made of star stuff, and we are a way for the universe to know itself.",
      "Simplicity is the ultimate sophistication and the most difficult thing to achieve in any craft.",
      "Creativity is intelligence having fun, playing with ideas without fear of being wrong.",
      "Focus is not about saying yes to the right thing, it is about saying no to the other hundred."
    ];
    let passage = '';
    let pos = 0, errors = 0, started = 0, done = false;
    let timer = null;

    const textEl = v.querySelector('#ty_text');
    const input = v.querySelector('#ty_input');

    function newPassage() {
      passage = PASSAGES[Math.floor(Math.random()*PASSAGES.length)];
      pos = 0; errors = 0; started = 0; done = false;
      render();
      clearInterval(timer); timer = null;
      v.querySelector('#ty_time').textContent = '0:00';
      v.querySelector('#ty_wpm').textContent = '0';
      v.querySelector('#ty_acc').innerHTML = '100<span class="u">%</span>';
      v.querySelector('#ty_err').textContent = '0';
      input.value = '';
    }

    function render() {
      textEl.innerHTML = passage.split('').map((ch, i) => {
        if (i < pos) return `<span class="ok">${ch}</span>`;
        if (i === pos) return `<span class="cur">${ch}</span>`;
        return `<span>${ch}</span>`;
      }).join('');
    }

    textEl.addEventListener('click', () => input.focus());

    input.addEventListener('input', () => {
      if (done) return;
      if (!started) {
        started = performance.now();
        timer = setInterval(tick, 250);
      }
      const val = input.value;
      const lastCh = val[val.length-1];
      const expected = passage[pos];
      if (lastCh === expected) {
        pos++;
        render();
        if (pos >= passage.length) finish();
      } else {
        errors++;
        input.value = val.slice(0, -1);
        v.querySelector('#ty_err').textContent = errors;
        // flash red
        textEl.style.transition = 'none';
        textEl.style.boxShadow = 'inset 0 0 0 1px var(--bad)';
        setTimeout(()=>textEl.style.boxShadow = '', 120);
      }
      updateStats();
    });

    function tick() {
      updateStats();
    }

    function updateStats() {
      if (!started) return;
      const min = (performance.now() - started) / 60000;
      const wpm = min > 0 ? Math.round((pos/5) / min) : 0;
      v.querySelector('#ty_wpm').textContent = wpm;
      const acc = pos + errors > 0 ? Math.round(pos/(pos+errors)*100) : 100;
      v.querySelector('#ty_acc').innerHTML = acc + '<span class="u">%</span>';
      const s = Math.floor(min*60);
      v.querySelector('#ty_time').textContent = fmtTime(s);
    }

    function finish() {
      done = true;
      clearInterval(timer); timer = null;
      updateStats();
      toast('Done! ' + v.querySelector('#ty_wpm').textContent + ' WPM');
    }

    v.querySelector('#ty_new').addEventListener('click', newPassage);
    v.querySelector('#ty_reset').addEventListener('click', () => {
      pos = 0; errors = 0; started = 0; done = false;
      input.value = ''; render();
      clearInterval(timer); timer = null;
      v.querySelector('#ty_wpm').textContent = '0';
      v.querySelector('#ty_time').textContent = '0:00';
      v.querySelector('#ty_err').textContent = '0';
      v.querySelector('#ty_acc').innerHTML = '100<span class="u">%</span>';
    });

    newPassage();
    Engine.cleanup = () => clearInterval(timer);
  }
};

        const hex = b => Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
        res.innerHTML = `
          <div style="margin-bottom:12px"><div style="font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);font-weight:700;margin-bottom:4px">File</div><div style="font-size:14px;font-weight:600">${file.name}</div><div style="font-size:11px;color:var(--dim)">${(file.size/1024).toFixed(1)} KB · ${file.type || 'unknown type'}</div></div>
          <div style="margin-bottom:12px"><div style="font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);font-weight:700;margin-bottom:4px">SHA-256</div><div style="font-family:ui-monospace,monospace;font-size:11px;word-break:break-all;color:var(--accent)">${hex(sha256)}</div></div>
          <div style="margin-bottom:12px"><div style="font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);font-weight:700;margin-bottom:4px">SHA-1</div><div style="font-family:ui-monospace,monospace;font-size:11px;word-break:break-all">${hex(sha1)}</div></div>
          <div><div style="font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);font-weight:700;margin-bottom:4px">SHA-512</div><div style="font-family:ui-monospace,monospace;font-size:10px;word-break:break-all;color:var(--dim)">${hex(sha512)}</div></div>
        `;
        toast('Hashed successfully');
      } catch (e) {
        res.innerHTML = '<span style="color:var(--bad)">⚠ ' + e.message + '</span>';
      }
    }
  }
};

/* ------------------------------------------------------------
   COLOR TOOLS
   ------------------------------------------------------------ */
TOOLS.color = {
  name: 'Color Tools', icon: '◭', cat: 'Utility',
  sub: 'Palette generator & contrast checker',
  html: () => `
    <div class="card">
      <h3>Palette generator</h3>
      <div class="row" style="margin-bottom:14px">
        <button class="btn primary" id="cl_gen">Generate palette</button>
        <button class="btn" data-harmony="analogous">Analogous</button>
        <button class="btn" data-harmony="complementary">Complementary</button>
        <button class="btn" data-harmony="triadic">Triadic</button>
      </div>
      <div class="palette" id="cl_palette"></div>
      <p class="hint">Click any swatch to copy its hex code.</p>
    </div>
    <div class="card">
      <h3>Contrast checker (WCAG)</h3>
      <div class="grid2">
        <div>
          <div class="lbl" style="font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);font-weight:700;margin-bottom:7px">Foreground</div>
          <input type="text" id="cl_fg" value="#ffffff">
        </div>
        <div>
          <div class="lbl" style="font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);font-weight:700;margin-bottom:7px">Background</div>
          <input type="text" id="cl_bg" value="#000000">
        </div>
      </div>
      <div id="cl_preview" style="margin-top:16px;padding:20px;border-radius:12px;border:1px solid var(--line);font-size:15px;line-height:1.5">
        The quick brown fox jumps over the lazy dog.
      </div>
      <div id="cl_result" style="margin-top:12px"></div>
    </div>
  `,
  init: (v) => {
    let hue = Math.random() * 360;
    let harmony = 'analogous';

    function hsl(h, s, l) { return `hsl(${h}, ${s}%, ${l}%)`; }
    function hslToHex(h, s, l) {
      l /= 100;
      const a = s * Math.min(l, 1-l) / 100;
      const f = n => {
        const k = (n + h/30) % 12;
        const c = l - a * Math.max(Math.min(k-3, 9-k, 1), -1);
        return Math.round(255 * c).toString(16).padStart(2, '0');
      };
      return '#' + f(0) + f(8) + f(4);
    }

    function generate() {
      hue = Math.random() * 360;
      let offsets;
      switch (harmony) {
        case 'analogous': offsets = [-40, -20, 0, 20, 40]; break;
        case 'complementary': offsets = [0, 0, 180, 180, 200]; break;
        case 'triadic': offsets = [0, 120, 240, 60, 300]; break;
        default: offsets = [0, 60, 120, 180, 240];
      }
      const palette = v.querySelector('#cl_palette');
      palette.innerHTML = '';
      const lightness = [65, 55, 45, 55, 65];
      offsets.forEach((off, i) => {
        const h = (hue + off + 360) % 360;
        const hex = hslToHex(h, 65, lightness[i]);
        const sw = el(`<div class="swatch" style="background:${hex}"><span>${hex}</span></div>`);
        sw.addEventListener('click', () => {
          navigator.clipboard.writeText(hex).then(() => toast('Copied ' + hex));
        });
        palette.appendChild(sw);
      });
    }

    v.querySelector('#cl_gen').addEventListener('click', generate);
    v.querySelectorAll('[data-harmony]').forEach(b => {
      b.addEventListener('click', () => { harmony = b.dataset.harmony; generate(); });
    });

    // contrast checker
    function hexToRgb(h) {
      h = h.trim().replace('#','');
      if (h.length === 3) h = h.split('').map(c=>c+c).join('');
      if (!/^[0-9a-f]{6}$/i.test(h)) return null;
      const n = parseInt(h, 16);
      return { r:(n>>16)&255, g:(n>>8)&255, b:n&255 };
    }
    function lum(rgb) {
      const f = c => { c /= 255; return c <= 0.03928 ? c/12.92 : Math.pow((c+0.055)/1.055, 2.4); };
      return 0.2126*f(rgb.r) + 0.7152*f(rgb.g) + 0.0722*f(rgb.b);
    }
    function check() {
      const fg = v.querySelector('#cl_fg').value;
      const bg = v.querySelector('#cl_bg').value;
      const frgb = hexToRgb(fg), brgb = hexToRgb(bg);
      const prev = v.querySelector('#cl_preview');
      const res = v.querySelector('#cl_result');
      if (!frgb || !brgb) { res.innerHTML = '<span style="color:var(--bad)">⚠ Use hex format like #ffffff</span>'; return; }
      prev.style.color = fg; prev.style.background = bg;
      const l1 = lum(frgb), l2 = lum(brgb);
      const ratio = (Math.max(l1,l2) + 0.05) / (Math.min(l1,l2) + 0.05);
      const pass = {
        aa: ratio >= 4.5,
        aaLarge: ratio >= 3,
        aaa: ratio >= 7,
        aaaLarge: ratio >= 4.5
      };
      res.innerHTML = `
        <div style="display:flex;align-items:baseline;gap:12px;margin-bottom:10px">
          <div style="font-size:32px;font-weight:700;font-variant-numeric:tabular-nums">${ratio.toFixed(2)}</div>
          <div style="color:var(--dim);font-size:13px">contrast ratio</div>
        </div>
        <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px">
          <div class="stat" style="padding:9px 11px"><div class="k">AA</div><div style="font-size:13px;font-weight:700;color:${pass.aa?'var(--ok)':'var(--bad)'}">${pass.aa?'✓ Pass':'✗ Fail'}</div></div>
          <div class="stat" style="padding:9px 11px"><div class="k">AA Large</div><div style="font-size:13px;font-weight:700;color:${pass.aaLarge?'var(--ok)':'var(--bad)'}">${pass.aaLarge?'✓ Pass':'✗ Fail'}</div></div>
          <div class="stat" style="padding:9px 11px"><div class="k">AAA</div><div style="font-size:13px;font-weight:700;color:${pass.aaa?'var(--ok)':'var(--bad)'}">${pass.aaa?'✓ Pass':'✗ Fail'}</div></div>
          <div class="stat" style="padding:9px 11px"><div class="k">AAA Large</div><div style="font-size:13px;font-weight:700;color:${pass.aaaLarge?'var(--ok)':'✗ Fail'}">${pass.aaaLarge?'✓ Pass':'✗ Fail'}</div></div>
        </div>
      `;
    }
    v.querySelector('#cl_fg').addEventListener('input', check);
    v.querySelector('#cl_bg').addEventListener('input', check);

    generate(); check();
  }
};

/* ------------------------------------------------------------
   REGISTRY METADATA
   ------------------------------------------------------------ */
const ORDER = [
  { cat: 'Audio', ids: ['studio','breathing','meditation','soundscape','tinnitus'] },
  { cat: 'Focus', ids: ['pomodoro','habits','sleep'] },
  { cat: 'Learn', ids: ['typing'] },
  { cat: 'Utility', ids: ['encoder','json','hash','color'] }
];

/* ============================================================
   NAVIGATION + ROUTER
   ============================================================ */
const nav = document.getElementById('nav');
const view = document.getElementById('view');
const sidebar = document.getElementById('sidebar');
const backdrop = document.getElementById('backdrop');
const hamburger = document.getElementById('hamburger');
const tbTitle = document.getElementById('tbTitle');
const tbSub = document.getElementById('tbSub');
const tbPill = document.getElementById('tbPill');

ORDER.forEach(g => {
  const grp = document.createElement('div');
  grp.className = 'sb-group';
  grp.innerHTML = `<h2>${g.cat}</h2>`;
  g.ids.forEach(id => {
    const t = TOOLS[id];
    if (!t) return;
    const b = document.createElement('button');
    b.className = 'navitem';
    b.dataset.id = id;
    b.innerHTML = `<span class="ico">${t.icon}</span><span>${t.name}</span>`;
    b.addEventListener('click', () => mount(id));
    grp.appendChild(b);
  });
  nav.appendChild(grp);
});

let currentId = null;

function mount(id) {
  const tool = TOOLS[id];
  if (!tool || currentId === id) return;
  Engine.unmount();
  currentId = id;

  tbTitle.textContent = tool.name;
  tbSub.textContent = tool.sub;
  tbPill.textContent = 'ready';

  view.innerHTML = '';
  const container = document.createElement('div');
  container.innerHTML = tool.html();
  view.appendChild(container);
  try {
    tool.init(container);
  } catch (e) {
    console.error(e);
    view.innerHTML = '<div class="card" style="color:var(--bad)">⚠ Failed to load this tool: ' + e.message + '</div>';
  }

  document.querySelectorAll('.navitem').forEach(n => n.classList.toggle('active', n.dataset.id === id));

  // close mobile sidebar
  sidebar.classList.remove('open');
  backdrop.classList.remove('show');
}

hamburger.addEventListener('click', () => {
  sidebar.classList.toggle('open');
  backdrop.classList.toggle('show');
});
backdrop.addEventListener('click', () => {
  sidebar.classList.remove('open');
  backdrop.classList.remove('show');
});

/* initial */
mount('studio');

})();
</script>
</body>
</html>
